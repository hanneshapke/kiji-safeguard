name: Render demo GIFs

# Manual on purpose: re-render the VHS demo tapes when the CLI output changes,
# then download the artifact and commit demo/gif/*.gif. Flip to auto-commit if
# you'd rather the GIFs track main automatically.
on:
  workflow_dispatch:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render tapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install ttyd
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd
      - name: Install VHS
        uses: charmbracelet/vhs-action@5f3e8b06b9a98e24aaaaede3f3a1a9f2c2a52f8 # v2.1.0
        with:
          install-only: true
      - name: Render
        run: ./demo/render.sh
      - name: Upload GIFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-gifs
          path: demo/gif/*.gif
          if-no-files-found: error
